# Astro でビルドして GitHub Pages に公開する。
# Pages の Source は「GitHub Actions」（Settings → Pages）。
name: Deploy

on:
  push:
    branches: [master]
  # トップの「最新記事」（blog の RSS）と「今日の Wikipedia」を更新するため、毎日作り直す。
  # Wikipedia の選り抜き記事は 0:00 JST に切り替わる。GitHub の定期実行は数時間遅れることがあるので、
  # 00:05 と 03:10 JST の 2 回動かす（同じ日に何度作っても結果は同じ）。混む毎時 0 分は避ける。
  schedule:
    - cron: "5 15 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重ならないようにする。走っている公開は止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # sitemap.xml の lastmod を git の履歴から出すため、全履歴を取る
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
