# Biome で lint と整形のチェックをする（書き換えはしない）。
# 対象と除外は biome.json。公開（deploy.yml）とは別で、落ちても公開は止まらない。
name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同じブランチ・PR で新しい push が来たら、古いチェックは止める。
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Actions 上では問題箇所を PR の差分に注釈として出す
      - run: npx biome ci
