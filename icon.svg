<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a1c"/>
      <stop offset="100%" stop-color="#08060f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#b14bff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#b14bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#00e0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="52%" cy="108%" r="45%">
      <stop offset="0%" stop-color="#ff3df0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff3df0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b14bff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm">
      <rect width="512" height="512" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)" mask="url(#gm)"/>
  <rect width="512" height="512" fill="url(#glow1)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <rect width="512" height="512" fill="url(#glow3)"/>
</svg>
